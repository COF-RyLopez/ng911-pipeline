[project]
name = "overture-extension-ng911-railroad"
version = "0.7.0"
description = "Prototype GERS Extension: NENA NG9-1-1 (STA-006) railroad centerline properties for Overture rail segments"
requires-python = ">=3.10"
dependencies = ["overture-schema-theme-transportation>=2.0,<3", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest", "packaging"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["overture_ext_ng911_rl"]
