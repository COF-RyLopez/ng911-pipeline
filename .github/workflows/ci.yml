name: NG911 Pipeline CI/CD Quality & Compliance Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Validate Overture Schema, dbt Tests & Cal OES Audit
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 and could change the apt tippecanoe build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false  # no lockfile to key a cache on; v3 defaulted to off

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          uv pip install --system dbt-duckdb duckdb pydantic overture-schema pyarrow pandas requests fastapi uvicorn httpx boto3 tylertoo

      - name: Validate Overture Maps Schema v2
        run: |
          python scripts/validate_overture_schema.py

      - name: Ingest & Cache Pilot Data
        run: |
          python scripts/fetch_pilot_data.py

      # run_pilot.py writes source_freshness.json, then runs dbt run + dbt test itself
      # (stg_source_dates reads that file), so dbt must not run as a separate step first.
      - name: Run NG911 Pilot (dbt run + dbt test) & Cal OES 98% Readiness Audit
        run: |
          python scripts/run_pilot.py

      - name: Test NENA STA-005.1.2 ECRF/LVF Microservice (reads the outputs run_pilot.py just built)
        run: |
          python scripts/test_nena_service.py

      - name: Publish GeoParquet & PMTiles to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: "https://pub-152dce9299c94555bb415d992fe120e7.r2.dev"
        run: |
          python scripts/publish_to_r2.py
