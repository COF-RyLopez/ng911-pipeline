name: NG911 Pipeline CI/CD Quality & Compliance Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Validate Overture Schema, dbt Tests & Cal OES Audit (${{ matrix.county }})
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 and could change the apt tippecanoe build
    timeout-minutes: 45  # a normal run takes ~15 min; a stuck runner (e.g. hung apt-get) otherwise holds the run for 6 h
    strategy:
      fail-fast: false  # one county's data problem must not cancel the other counties
      matrix:
        # FIPS codes from the dbt_project.yml counties registry. Only Fresno publishes to R2 until
        # outputs move to per-county R2 prefixes (publish_to_r2.py prunes every key it didn't upload).
        county: ["06019", "06031"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false  # no lockfile to key a cache on; v3 defaulted to off

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          uv pip install --system dbt-duckdb duckdb pydantic overture-schema pyarrow pandas requests fastapi uvicorn httpx boto3 tylertoo

      - name: Validate Overture Maps Schema v2
        run: |
          python scripts/validate_overture_schema.py

      - name: Ingest & Cache Pilot Data
        run: |
          python scripts/fetch_pilot_data.py

      # run_pilot.py writes source_freshness.json, then runs dbt run + dbt test itself
      # (stg_source_dates reads that file), so dbt must not run as a separate step first.
      - name: Run NG911 Pilot (dbt run + dbt test) & Cal OES 98% Readiness Audit
        run: |
          python scripts/run_pilot.py --county ${{ matrix.county }}

      - name: Test NENA STA-005.1.2 ECRF/LVF Microservice (reads the outputs run_pilot.py just built)
        if: matrix.county == '06019'  # the test geocodes 2600 Fresno St
        run: |
          python scripts/test_nena_service.py

      - name: Publish GeoParquet & PMTiles to Cloudflare R2
        if: github.ref == 'refs/heads/main' && matrix.county == '06019'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: "https://pub-152dce9299c94555bb415d992fe120e7.r2.dev"
        run: |
          python scripts/publish_to_r2.py --part county

  # Product 1 at state scale, in parallel with the county jobs: the statewide Overture scorecard, then
  # the Overture-only build (oo_* models) for all 56 counties not built from county GIS, weakest first.
  # Needs only Overture data, and publishes only its own R2 keys (publish_to_r2.py --part overture).
  overture-only:
    name: Statewide Scorecard & Overture-only Build (56 counties)
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a normal run takes ~35 min
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          uv pip install --system dbt-duckdb duckdb pydantic overture-schema pyarrow pandas requests fastapi uvicorn httpx boto3 tylertoo

      - name: Statewide Overture Scorecard (all California counties)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}  # free key: https://api.census.gov/data/key_signup.html
        run: |
          python scripts/statewide_overture_scorecard.py --state CA

      - name: Overture-only build for the 56 counties
        run: |
          python scripts/overture_only_counties.py --top 56

      # Prototype NG911 GERS Extension: the package (extensions/ng911-address) and its data, keyed on GERS IDs
      - name: Build the NG911 GERS Extension dataset and check package conformance
        run: |
          python scripts/build_ng911_extension.py
          uv pip install --system ./extensions/ng911-address packaging
          python extensions/ng911-address/tests/test_conformance.py

      - name: Publish statewide & Overture-only outputs to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/publish_to_r2.py --part overture
