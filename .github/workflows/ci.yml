name: NG911 Pipeline CI/CD Quality & Compliance Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Validate Overture Schema, dbt Tests & Cal OES Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          uv pip install --system dbt-duckdb duckdb pydantic overture-schema pyarrow pandas requests fastapi uvicorn httpx

      - name: Validate Overture Maps Schema v2
        run: |
          python scripts/validate_overture_schema.py

      - name: Ingest & Cache Pilot Data
        run: |
          python scripts/fetch_pilot_data.py

      - name: Test NENA STA-005.1.2 ECRF/LVF Microservice
        run: |
          python scripts/test_nena_service.py

      - name: Execute dbt Transformations
        run: |
          dbt run --profiles-dir .

      - name: Execute dbt Data Quality Tests (83/83)
        run: |
          dbt test --profiles-dir .

      - name: Run NG911 Pilot & Cal OES 98% Readiness Audit
        run: |
          python scripts/run_pilot.py
