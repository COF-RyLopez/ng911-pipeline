name: Product 2 - County Endpoint Discovery (OpenAddresses + ArcGIS catalogs)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"  # weekly: OA sources and county servers change slowly
  pull_request:
    paths:
      - scripts/discover_county_endpoints.py
      - scripts/oa_conform_audit.py
      - .github/workflows/discover_endpoints.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write  # post the discovery summary on the PR
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch OpenAddresses California sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openaddresses/openaddresses oa
          git -C oa sparse-checkout set sources/us/ca

      - name: Discover endpoints
        run: |
          python scripts/discover_county_endpoints.py oa/sources/us/ca | tee discovery.log
          { echo '### Endpoint discovery'; echo '```'; cat discovery.log; echo '```'
            echo '<details><summary>Per-jurisdiction summary</summary>'; echo; echo '```'
            cat data/output/discovery/ca_discovery_summary.csv; echo '```'; echo '</details>'; } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Overture's addresses are these OpenAddresses records: check each source's field mapping against the
      # live county layer (renamed / mostly empty fields, better unused ones) for fixes worth an OA PR
      - name: Audit OpenAddresses field mappings
        run: |
          python scripts/oa_conform_audit.py oa/sources/us/ca | tee audit.log
          { echo '### OpenAddresses field-mapping audit'; echo '```'; cat audit.log; echo '```'; } >> summary.md
          cat audit.log >> "$GITHUB_STEP_SUMMARY"

      - name: Post summary on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v5
        with:
          name: ca-endpoint-discovery
          path: data/output/discovery/
