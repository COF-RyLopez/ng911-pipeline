name: NENA supplemental datasets (hydrology, fire boundary candidate)

# Supplemental datasets, built apart from ci.yml: the statewide 3DHP pull takes ~40 min and 3DHP updates
# quarterly, so they run monthly (and when their scripts change) instead of on every build. Both publish under
# `supplemental/` (publish_to_r2.py --part supplemental), so the other jobs never prune them, and are built in
# the same run because that part publishes (and prunes) as a whole.
on:
  schedule:
    - cron: "17 9 3 * *"  # 3rd of each month, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "scripts/build_ng911_hydrology.py", "scripts/build_ng911_fire_boundary.py", ".github/workflows/hydrology.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "scripts/build_ng911_hydrology.py", "scripts/build_ng911_fire_boundary.py", ".github/workflows/hydrology.yml" ]

jobs:
  hydrology:
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # a normal run takes ~40 min, most of it waiting on the USGS service
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system duckdb boto3 tylertoo

      - name: Build the NENA Hydrology Line and Polygon layers from 3DHP
        run: python scripts/build_ng911_hydrology.py

      - name: Build the candidate NENA FirePolygon layer (CAL FIRE districts + Direct Protection Areas)
        run: python scripts/build_ng911_fire_boundary.py

      - name: Publish to Cloudflare R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/publish_to_r2.py --part supplemental
