version: 2

models:
  - name: stg_county_addresses
    description: "Authoritative municipal and county address points ingested from Fresno County ArcGIS FeatureServer."
    columns:
      - name: county_id
        description: "Primary feature identifier from County of Fresno GIS."
        tests:
          - not_null
      - name: house_number
        tests:
          - not_null
      - name: street_name
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null

  - name: stg_county_streets
    description: "Road centerlines from OpenAddresses processed county sources (Fresno, plus Kings and Tulare when include_surrounding_counties), with names split into NENA components."
    columns:
      - name: street_segment_id
        description: "Stable segment key: county + md5 of the geometry."
        tests:
          - not_null
      - name: street_name
        tests:
          - not_null
      - name: geom
        tests:
          - not_null

  - name: stg_county_boundaries
    description: "Authoritative Emergency Service Boundaries (ESBs) from Fresno County: law enforcement dispatch areas, fire districts, city limits."
    columns:
      - name: esb_nguid
        tests:
          - not_null
      - name: agency_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LAW', 'FIRE', 'MUNICIPAL']
      - name: agency_name
        tests:
          - not_null
      - name: geom
        tests:
          - not_null

  - name: stg_overture_places
    description: "Authoritative Landmark / POI locations from Overture Maps scoped to pilot extent."
    columns:
      - name: place_id
        tests:
          - not_null
      - name: place_name
        tests:
          - not_null
      - name: geom
        tests:
          - not_null

  - name: stg_overture_addresses
    description: "Global open address GeoParquet points from Overture Maps scoped to the pilot extent."
    columns:
      - name: overture_id
        description: "Global Entity Reference System (GERS) ID assigned by Overture Maps."
        tests:
          - not_null
          - unique
      - name: house_number
        tests:
          - not_null

  - name: stg_overture_transportation
    description: "Global open road segments from Overture Maps scoped to the pilot extent (read-only QA/QC reference)."
    columns:
      - name: overture_segment_id
        tests:
          - not_null
      - name: road_name
        tests:
          - not_null

  - name: int_address_conflation
    description: "Intermediate spatial buffer and address component conflation resolving county and Overture data."
    columns:
      - name: conflation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CONFLATED', 'COUNTY_ONLY', 'OVERTURE_ONLY']

  - name: int_address_landmarks
    description: "Spatial proximity join matching address points to authoritative landmark POIs within 60m."
    columns:
      - name: addr_uid
        tests:
          - not_null
          - unique
      - name: landmark_name
        tests:
          - not_null

  - name: mart_ng911_addresses
    description: "NENA-STA-010 compliant Site/Structure Address Point (SSAP) data mart with automated ESB dispatch attribution and landmark conflation."
    columns:
      - name: SSAP_NGUID
        description: "NENA Globally Unique Identifier formatted as urn:emergency:uid:gis:SSAP:<id>:<domain>."
        tests:
          - not_null
          - unique
      - name: DisclID
        description: "Discrepancy Agency Identifier (FQDN of the authoritative GIS data provider)."
        tests:
          - not_null
      - name: ConflationStatus
        description: "Conflation classification indicator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CONFLATED', 'COUNTY_ONLY', 'OVERTURE_ONLY']
      - name: HNO
        description: "NENA House Number."
        tests:
          - not_null
      - name: STN
        description: "NENA Street Name."
        tests:
          - not_null
      - name: County
        description: "Authoritative county name."
        tests:
          - not_null
      - name: State
        description: "State abbreviation."
        tests:
          - not_null
      - name: Longitude
        description: "WGS84 Longitude in decimal degrees."
        tests:
          - not_null
      - name: Latitude
        description: "WGS84 Latitude in decimal degrees."
        tests:
          - not_null
      - name: ST_Geometry
        description: "Native spatial point geometry / WKB representation."
        tests:
          - not_null

  - name: mart_ng911_emergency_boundaries
    description: "NENA-STA-010 compliant Emergency Service Boundaries (ESBs: Fire, Law/CAD, Municipal)."
    columns:
      - name: ESB_NGUID
        tests:
          - not_null
          - unique
      - name: DisclID
        tests:
          - not_null
      - name: Agency_Type
        tests:
          - not_null
      - name: Agency_Name
        tests:
          - not_null
      - name: ST_Geometry
        tests:
          - not_null

  - name: mart_ng911_road_centerlines
    description: "NENA-STA-010 compliant Road Centerline (RCL) data mart with synthesized address ranges."
    columns:
      - name: RCL_NGUID
        description: "NENA Globally Unique Road Centerline Identifier."
        tests:
          - not_null
          - unique
      - name: DisclID
        tests:
          - not_null
      - name: St_Name
        tests:
          - not_null
      - name: ST_Geometry
        description: "100% Authoritative County geometry (ODbL isolated)."
        tests:
          - not_null

  - name: mart_ng911_qa_fishbones
    description: "NENA-STA-010 QA/QC Fishbone vector lines validating address point to road centerline parity and distance."
    columns:
      - name: FishboneID
        tests:
          - not_null
          - unique
      - name: SSAP_NGUID
        tests:
          - not_null
      - name: RCL_NGUID
        tests:
          - not_null
      - name: ST_Geometry
        tests:
          - not_null

  - name: mart_ng911_qa_readiness_audit
    description: "Cal OES 98% NG911 Transition Readiness Audit scorecard evaluating spatial compliance and boundary coverage."
    columns:
      - name: Jurisdiction
        tests:
          - not_null
      - name: Authoritative_SSAP_Addresses
        tests:
          - not_null
      - name: Cal_OES_Readiness_Status
        tests:
          - not_null

  - name: mart_ng911_cross_county_audits
    description: "NENA 02-014.1 Cross-County Boundary Audit model detecting road centerline disconnects and PSAP boundary gaps/overlaps across regional county borders."
    columns:
      - name: DiscrepancyID
        tests:
          - not_null
          - unique
      - name: FeatureNGUID
        tests:
          - not_null
      - name: DiscrepancyType
        tests:
          - not_null
      - name: ST_Geometry
        tests:
          - not_null

  - name: mart_nena3_discrpag
    description: "NENA v3.0 Relational Discrepancy Agency (ng911.DiscrpAg) registry."
    columns:
      - name: ID
        tests:
          - not_null
          - unique
      - name: DiscrpAgID
        tests:
          - not_null
          - unique

  - name: mart_nena3_serviceurn
    description: "NENA v3.0 Relational Service URN (ng911.ServiceURN) standardized lookup table."
    columns:
      - name: ID
        tests:
          - not_null
          - unique
      - name: ServiceURN
        tests:
          - not_null
          - unique

  - name: mart_nena3_completestnam
    description: "NENA v3.0 Relational Complete Street Name (ng911.CompleteStNam) normalized lookup."
    columns:
      - name: CompleteStNam_ID
        tests:
          - not_null
          - unique
      - name: St_Name
        tests:
          - not_null

  - name: mart_nena3_completeadnum
    description: "NENA v3.0 Relational Complete Address Number (ng911.CompleteAdNum) normalized lookup."
    columns:
      - name: CompleteAdNum_ID
        tests:
          - not_null
          - unique
      - name: Add_Number
        tests:
          - not_null

  - name: mart_nena3_adpt
    description: "NENA v3.0 Relational Site/Structure Address Point (ng911.AdPt) table."
    columns:
      - name: A1toA5Code_ID
        tests:
          - not_null
          - relationships: {arguments: {to: ref('mart_nena3_a1toa5code'), field: ID}}
      - name: DateUpdate
        tests: [not_null]
      - name: ID
        tests:
          - not_null
          - unique
      - name: NGUID
        tests:
          - not_null
          - unique
      - name: GEOMETRY
        tests:
          - not_null

  - name: mart_nena3_stseg
    description: "NENA v3.0 Relational Street Segment (ng911.StSeg) table."
    columns:
      - name: RdClass_ID
        tests:
          - not_null
          - relationships: {arguments: {to: ref('mart_nena3_rdclass'), field: ID}}
      - name: DateUpdate
        tests: [not_null]
      - name: AliasSet_ID
        tests:
          - not_null
          - relationships: {arguments: {to: ref('mart_nena3_aliasset'), field: ID}}
      - name: ID
        tests:
          - not_null
          - unique
      - name: NGUID
        tests:
          - not_null
          - unique
      - name: GEOMETRY
        tests:
          - not_null

  - name: mart_nena3_aliasset
    description: "NENA v3.0 Relational Alias Set (ng911.AliasSet). ID 0 is the empty set for segments without aliases."
    columns:
      - name: ID
        tests: [not_null, unique]

  - name: mart_nena3_alias
    description: "NENA v3.0 Relational Alias (ng911.Alias): which CompleteStNam names belong to each AliasSet."
    columns:
      - name: ID
        tests: [not_null, unique]
      - name: AliasSet_ID
        tests:
          - not_null
          - relationships: {arguments: {to: ref('mart_nena3_aliasset'), field: ID}}
      - name: CompleteStNam_ID
        tests:
          - not_null
          - relationships: {arguments: {to: ref('mart_nena3_completestnam'), field: CompleteStNam_ID}}

  - name: mart_ng911_alias_review
    description: "Road geometries with more than one street name, categorized for county GIS review."
    columns:
      - name: CountyLocalID
        tests: [not_null, unique]
      - name: ReviewCategory
        tests:
          - accepted_values: {arguments: {values: ['UNRESOLVED', 'NAME_CONFLICT', 'ALIAS']}}

  - name: mart_nena3_serviceboundary
    description: "NENA v3.0 Relational Service Boundary (ng911.ServiceBoundary) table."
    columns:
      - name: ServiceURN_ID
        tests:
          - not_null
          - accepted_values: {arguments: {values: [2, 3], quote: false}}
      - name: DateUpdate
        tests: [not_null]
      - name: ID
        tests:
          - not_null
          - unique
      - name: NGUID
        tests:
          - not_null
      - name: GEOMETRY
        tests:
          - not_null

  - name: mart_nena3_a1toa5code
    description: "NENA v3.0 ng911.A1toA5Code: state / county / incorporated municipality combinations."
    columns:
      - name: ID
        tests: [not_null, unique]
      - name: A1
        tests: [not_null]

  - name: mart_nena3_a3boundary
    description: "NENA v3.0 ng911.A3Boundary: incorporated municipalities (Fresno city limits)."
    columns:
      - name: NGUID
        tests: [not_null, unique]

  - name: mart_nena3_rdclass
    description: "NENA road class registry values."
    columns:
      - name: ID
        tests: [not_null, unique]

  - name: mart_ng911_address_enhancements
    description: "NG911 Address Enhancements model categorizing spatial displacement, PSAP enrichment, and street normalization."
    columns:
      - name: SSAP_NGUID
        tests:
          - not_null
      - name: EnhancementCategory
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SPATIAL_CORRECTION', 'LANDMARK_ALIASED', 'PSAP_ENRICHMENT', 'NENA_STREET_NORMALIZED', 'UNCHANGED']
      - name: DisplacementMeters
        tests:
          - not_null

  - name: mart_ng911_county_remediation_export
    description: "Actionable jurisdiction remediation report exporting building footprint status, Mapillary URLs, and remediation guidance."
    columns:
      - name: SSAP_NGUID
        tests:
          - not_null
      - name: SymbologyCategory
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CRITICAL_ATTENTION', 'OUTSIDE_BUILDING', 'ATTENTION_REQUIRED', 'VALIDATED_OK']
      - name: BuildingFootprintStatus
        tests:
          - not_null





  - name: mart_ng911_esb_qa
    description: "Topology QA for the law enforcement dispatch layer (City_County_CAD): invalid polygons, duplicate polygons and overlaps over 0.1 ha."
    columns:
      - name: IssueType
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['INVALID_GEOMETRY', 'DUPLICATE_POLYGON', 'OVERLAP']

  # Esri Address Data Management 2.5 exports: domain values from the ADM Pro project geodatabase
  - name: mart_esri_adm_siteaddresspoint
    description: "Esri ADM 2.5 SiteAddressPoint (field-for-field, ADM coded-value domains)."
    columns:
      - name: sitenguid
        tests: [not_null, unique]
      - name: unittype
        tests:
          - accepted_values:
              arguments:
                values: ['APT', 'BSMT', 'BLDG', 'DEPT', 'FL', 'FRNT', 'HNGR', 'KEY', 'LBBY', 'LOT', 'LOWR', 'OFC', 'PH', 'PIER', 'REAR', 'RM', 'SEAT', 'SIDE', 'SLIP', 'SPC', 'STOP', 'STE', 'TRLR', 'UNIT', 'UPPR', 'Other']
      - name: pointtype
        tests:
          - accepted_values:
              arguments:
                values: ['Building', 'Mile Post', 'Parcel', 'Unit, Condo, Office or Suite', 'Utility Asset', 'Other', 'Unknown']
      - name: capturemeth
        tests:
          - accepted_values:
              arguments:
                values: ['Community Contribution', 'Other', 'Plan or Drawing', 'Site Visit']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Current', 'Pending', 'Retired', 'Temporary', 'Other']

  - name: mart_esri_adm_roadcenterline
    description: "Esri ADM 2.5 RoadCenterline (field-for-field, ADM coded-value domains)."
    columns:
      - name: rclnguid
        tests: [not_null, unique]
      - name: parityleft
        tests:
          - accepted_values:
              arguments:
                values: ['O', 'E', 'B', 'Z']
      - name: parityright
        tests:
          - accepted_values:
              arguments:
                values: ['O', 'E', 'B', 'Z']
      - name: onewaydir
        tests:
          - accepted_values:
              arguments:
                values: ['From-To', 'To-From', 'Unknown', 'Both']
      - name: roadclass
        tests:
          - accepted_values:
              arguments:
                values: ['Freeway', 'Highway', 'Ramp', 'Major Arterial', 'Minor Arterial', 'Collector', 'Local', 'Service', '4WD', 'Recreation', 'Resource', 'Ferry', 'Other', 'Unknown']

  - name: mart_esri_adm_masterroadname
    description: "Esri ADM 2.5 MasterRoadName: distinct centerline road names."
    columns:
      - name: roadpredir
        tests:
          - accepted_values:
              arguments:
                values: ['N', 'S', 'E', 'W', 'NW', 'NE', 'SE', 'SW', 'NB', 'SB', 'EB', 'WB']
      - name: roadpostdir
        tests:
          - accepted_values:
              arguments:
                values: ['N', 'S', 'E', 'W', 'NE', 'NW', 'SE', 'SW']
      - name: roadtype
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['Aly', 'Anx', 'Arc', 'Ave', 'Byu', 'Bch', 'Bnd', 'Blf', 'Blfs', 'Btm', 'Blvd', 'Br', 'Brg', 'Brk', 'Brks', 'Bg', 'Bgs', 'Byp', 'Cp', 'Cyn', 'Cpe', 'Cswy', 'Ctr', 'Ctrs', 'Cir', 'Cirs', 'Clf', 'Clfs', 'Clb', 'Cmn', 'Cmns', 'Coll', 'Conn', 'Cor', 'Cors', 'Crse', 'Ct', 'Cts', 'Cv', 'Cvs', 'Crk', 'Cres', 'Crst', 'Xing', 'Xrd', 'Xrds', 'Curv', 'Dl', 'Dm', 'Dv', 'Dr', 'Drs', 'Est', 'Ests', 'Expy', 'Ext', 'Exts', 'Fall', 'Fls', 'Fry', 'Fld', 'Flds', 'Flt', 'Flts', 'Frd', 'Frds', 'Frst', 'Frg', 'Frgs', 'Frk', 'Frks', 'Ft', 'Fwy', 'Gdn', 'Gdns', 'Gtwy', 'Gln', 'Glns', 'Grn', 'Grns', 'Grv', 'Grvs', 'Hbr', 'Hbrs', 'Hvn', 'Hts', 'Hwy', 'Hl', 'Hls', 'Holw', 'Inlt', 'Is', 'Iss', 'Isle', 'Jct', 'Jcts', 'Ky', 'Kys', 'Knl', 'Knls', 'Lk', 'Lks', 'Land', 'Lndg', 'Ln', 'Lgt', 'Lgts', 'Lf', 'Lck', 'Lcks', 'Ldg', 'Loop', 'Mall', 'Mnr', 'Mnrs', 'Mdw', 'Mdws', 'Mews', 'Ml', 'Mls', 'Msn', 'Mtwy', 'Mt', 'Mtn', 'Mtns', 'Nck', 'Ofrp', 'Onrp', 'Orch', 'Oval', 'Opas', 'Park', 'Parks', 'Pkwy', 'Pkwys', 'Pass', 'Psge', 'Path', 'Pike', 'Pne', 'Pnes', 'Pl', 'Pln', 'Plns', 'Plz', 'Pt', 'Pts', 'Prt', 'Prts', 'Pr', 'Radl', 'Ramp', 'Rnch', 'Rpd', 'Rpds', 'Rst', 'Rdg', 'Rdgs', 'Riv', 'Rd', 'Rds', 'Rte', 'Row', 'Rue', 'Run', 'Shl', 'Shls', 'Shr', 'Shrs', 'Skwy', 'Spg', 'Spgs', 'Spur', 'Spurs', 'Sq', 'Sqs', 'Sta', 'Stra', 'Strm', 'St', 'Sts', 'Smt', 'Ter', 'Trwy', 'Trce', 'Trak', 'Trfy', 'Trl', 'Trlr', 'Tunl', 'Tpke', 'Upas', 'Un', 'Uns', 'Vly', 'Vlys', 'Via', 'Vw', 'Vws', 'Vlg', 'Vlgs', 'Vl', 'Vis', 'Walk', 'Walks', 'Wall', 'Way', 'Ways', 'Wl', 'Wls']

  # Product 1: Overture-only NG911 build (models/overture_only)
  - name: oo_address_points
    description: "Overture address points inside the county's Overture polygon."
    columns:
      - name: overture_id
        tests: [not_null, unique]
  - name: oo_road_centerlines
    description: "Named Overture road segments touching the county (OpenStreetMap-derived, ODbL)."
    columns:
      - name: overture_segment_id
        tests: [not_null, unique]
  - name: oo_fishbones
    description: "Each Overture address linked to the nearest same-named Overture road within ~400 m."
    columns:
      - name: overture_id
        tests: [not_null, unique]
  - name: oo_scorecard
    description: "Product 1 scorecard: how far Overture alone gets toward NG911 for the county."
    columns:
      - name: Jurisdiction
        tests: [not_null]

  - name: mart_boundary_comparison
    description: "Product 2: county city limits vs CDTFA (state geoportal) city boundaries, one row per city."
    columns:
      - name: City
        tests:
          - not_null
          - unique
      - name: Status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MATCH', 'MINOR_DIFFERENCES', 'MAJOR_DIFFERENCES', 'MISSING_LOCALLY', 'MISSING_IN_STATE', 'NO_LOCAL_LAYER']

  - name: mart_boundary_discrepancies
    description: "Product 2: polygons (1 ha and up) where county city limits and CDTFA disagree, with a likely cause."
    columns:
      - name: Side
        tests:
          - accepted_values:
              arguments:
                values: ['ONLY_IN_STATE', 'ONLY_IN_LOCAL']
      - name: Cause
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FILED_CHANGE', 'SLIVER', 'UNEXPLAINED']

  - name: mart_reconciled_city_boundaries
    description: "Product 2 (advisory): CDTFA city boundaries with the county's line used for slivers and filed changes."
    columns:
      - name: City
        tests:
          - not_null
          - unique

  - name: mart_boundary_parcel_alignment
    description: "Product 2: share of each city boundary within ~3 m of a parcel line, per source (CDTFA, COUNTY, RECONCILED)."
    columns:
      - name: Source
        tests:
          - accepted_values:
              arguments:
                values: ['CDTFA', 'COUNTY', 'RECONCILED']

  - name: mart_county_boundary_comparison
    description: "Product 2: the county polygon from Overture and TIGER compared with CDTFA's, plus county address points outside CDTFA's county line."
    columns:
      - name: ComparedTo
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['OVERTURE', 'TIGER']

  - name: mart_county_boundary_discrepancies
    description: "Product 2: pieces (1 ha and up) where Overture's or TIGER's county polygon disagrees with CDTFA's, with county address points in each."
    columns:
      - name: Cause
        tests:
          - accepted_values:
              arguments:
                values: ['SLIVER', 'UNEXPLAINED']

