ng911_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'ng911_database.duckdb'
      extensions:
        - spatial
        - httpfs
        - parquet
      settings:
        # DuckDB 2.0 refuses axis-sensitive functions (ST_Distance_Sphere) until this is set.
        # Every point is built ST_Point(lon, lat), so x = longitude.
        geometry_always_xy: true
